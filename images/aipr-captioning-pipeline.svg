<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Vision-Language Integration for Image Captioning pipeline</title>
  <desc id="desc">A paper-style pipeline diagram showing an input image, vision transformer tokens, a projection bridge, GPT-J decoding, and a generated caption.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.48" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#f7f1ff"/>
    </linearGradient>
    <linearGradient id="panelBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="panelGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="panelRose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe4e6"/>
      <stop offset="1" stop-color="#fecdd3"/>
    </linearGradient>
    <linearGradient id="panelAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#334155"/>
    </marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#cbd5e1" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="760" rx="0" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#grid)" opacity="0.55"/>

  <g transform="translate(58 48)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">
      Vision-Language Image Captioning Pipeline
    </text>
    <text x="0" y="36" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#475569">
      Vision Transformer features are aligned with GPT-J tokens to generate natural-language captions.
    </text>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="58" y="142" width="180" height="250" rx="18" fill="#ffffff"/>
    <rect x="78" y="168" width="140" height="116" rx="14" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="118" cy="210" r="20" fill="#facc15"/>
    <path d="M 78 268 L 126 230 L 162 258 L 186 236 L 218 268 Z" fill="#22c55e"/>
    <rect x="78" y="308" width="140" height="18" rx="6" fill="#bfdbfe"/>
    <rect x="78" y="336" width="140" height="18" rx="6" fill="#93c5fd"/>
    <text x="148" y="376" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">Input Image</text>
  </g>

  <line x1="248" y1="267" x2="322" y2="267" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="328" y="142" width="190" height="250" rx="18" fill="url(#panelBlue)" stroke="#60a5fa" stroke-width="2"/>
    <text x="423" y="184" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">Patch Tokens</text>
    <g transform="translate(366 210)">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="#ffffff"/>
      <rect x="44" y="0" width="34" height="34" rx="8" fill="#ffffff"/>
      <rect x="88" y="0" width="34" height="34" rx="8" fill="#ffffff"/>
      <rect x="0" y="44" width="34" height="34" rx="8" fill="#ffffff"/>
      <rect x="44" y="44" width="34" height="34" rx="8" fill="#ffffff"/>
      <rect x="88" y="44" width="34" height="34" rx="8" fill="#ffffff"/>
      <rect x="0" y="88" width="34" height="34" rx="8" fill="#ffffff"/>
      <rect x="44" y="88" width="34" height="34" rx="8" fill="#ffffff"/>
      <rect x="88" y="88" width="34" height="34" rx="8" fill="#ffffff"/>
    </g>
    <text x="423" y="366" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">ViT embeddings</text>
  </g>

  <line x1="530" y1="267" x2="604" y2="267" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="610" y="142" width="220" height="250" rx="18" fill="url(#panelGreen)" stroke="#22c55e" stroke-width="2"/>
    <text x="720" y="184" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">Projection Bridge</text>
    <path d="M 658 284 C 690 210, 754 210, 788 284" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
    <path d="M 658 284 C 690 354, 754 354, 788 284" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
    <circle cx="720" cy="284" r="28" fill="#ffffff" stroke="#10b981" stroke-width="4"/>
    <text x="720" y="291" text-anchor="middle" font-size="18" font-weight="900" fill="#047857">Align</text>
    <text x="720" y="366" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">visual tokens to text space</text>
  </g>

  <line x1="842" y1="267" x2="916" y2="267" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="922" y="142" width="220" height="250" rx="18" fill="url(#panelRose)" stroke="#fb7185" stroke-width="2"/>
    <text x="1032" y="184" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">GPT-J Decoder</text>
    <rect x="966" y="218" width="132" height="42" rx="10" fill="#ffffff"/>
    <rect x="966" y="274" width="132" height="42" rx="10" fill="#ffffff"/>
    <rect x="966" y="330" width="132" height="42" rx="10" fill="#ffffff"/>
    <text x="1032" y="244" text-anchor="middle" font-size="14" font-weight="800" fill="#be123c">token logits</text>
    <text x="1032" y="300" text-anchor="middle" font-size="14" font-weight="800" fill="#be123c">language prior</text>
    <text x="1032" y="356" text-anchor="middle" font-size="14" font-weight="800" fill="#be123c">caption stream</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="210" y="484" width="780" height="142" rx="18" fill="url(#panelAmber)" stroke="#f59e0b" stroke-width="2"/>
    <text x="600" y="526" text-anchor="middle" font-size="20" font-weight="900" fill="#0f172a">Generated Caption</text>
    <text x="600" y="574" text-anchor="middle" font-size="24" font-weight="800" fill="#78350f">
      "A model describes visual content using aligned image and language representations."
    </text>
    <text x="600" y="610" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">
      Evaluation: ROUGE
    </text>
  </g>

  <path d="M 1032 404 C 1032 462, 945 455, 910 484" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 720 404 C 720 452, 700 455, 672 484" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 423 404 C 423 452, 480 455, 514 484" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
