<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Sentinel neuro-symbolic DDoS defense architecture</title>
  <desc id="desc">Deployable traffic features flow to a multi-head PPO defender. A symbolic safety shield repairs unsafe proposals before mitigation is executed. An adaptive attacker and Hall-of-Fame archive support co-evolutionary training, while safe policy trajectories are crystallized into interpretable decision-tree rules.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#17333e" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176b80"/>
    </marker>
    <marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d96546"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #65747a; font-size: 17px; font-weight: 750; letter-spacing: 1.5px; }
      .title { fill: #17262d; font-size: 28px; font-weight: 780; }
      .copy { fill: #5f6f76; font-size: 18px; font-weight: 520; }
      .chip { fill: #36525d; font-size: 16px; font-weight: 680; }
      .arrow-label { fill: #176b80; font-size: 16px; font-weight: 760; letter-spacing: 1px; }
      .flow-label { fill: #176b80; font-size: 13px; font-weight: 780; letter-spacing: .7px; }
      .module-title { fill: #17262d; font-size: 20px; font-weight: 780; }
      .module-copy { fill: #5f6f76; font-size: 15px; font-weight: 520; }
    </style>
  </defs>

  <rect width="1400" height="620" rx="24" fill="#f5f8f8"/>
  <path d="M1200 145 V70 H485 V122" fill="none" stroke="#90a7af" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <rect x="714" y="47" width="224" height="42" rx="21" fill="#e6f2f4"/>
  <text class="sans arrow-label" x="826" y="74" text-anchor="middle">OBSERVATION + REWARD</text>

  <g filter="url(#shadow)">
    <rect x="40" y="145" width="240" height="245" rx="18" fill="#ffffff" stroke="#cad7db" stroke-width="2"/>
    <rect x="40" y="145" width="240" height="8" rx="4" fill="#70c3d4"/>
  </g>
  <rect x="64" y="175" width="104" height="34" rx="17" fill="#e6f2f4"/>
  <text class="sans label" x="116" y="198" text-anchor="middle" fill="#176b80">INPUT</text>
  <text class="sans title" x="64" y="243">Traffic state</text>
  <text class="sans copy" x="64" y="273">Deployable aggregate</text>
  <text class="sans copy" x="64" y="298">network features</text>
  <g>
    <rect x="64" y="324" width="89" height="38" rx="10" fill="#edf3f4"/>
    <rect x="160" y="324" width="96" height="38" rx="10" fill="#edf3f4"/>
    <text class="sans chip" x="108" y="349" text-anchor="middle">load</text>
    <text class="sans chip" x="208" y="349" text-anchor="middle">protocols</text>
  </g>

  <path d="M280 267 H344" fill="none" stroke="#176b80" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="sans flow-label" x="312" y="245" text-anchor="middle">STATE</text>

  <g filter="url(#shadow)">
    <rect x="350" y="115" width="270" height="305" rx="18" fill="#ffffff" stroke="#96cbd5" stroke-width="2"/>
    <rect x="350" y="115" width="270" height="8" rx="4" fill="#3e9eb2"/>
  </g>
  <rect x="374" y="145" width="104" height="34" rx="17" fill="#e4f2f4"/>
  <text class="sans label" x="426" y="168" text-anchor="middle" fill="#176b80">NEURAL</text>
  <text class="sans title" x="374" y="213">Multi-head PPO</text>
  <text class="sans copy" x="374" y="243">Learns a mitigation policy</text>
  <g fill="none" stroke="#176b80" stroke-width="3">
    <path d="M399 295 L448 274 L497 299 L546 269 L577 304"/>
    <path d="M399 295 L448 324 L497 299 L546 331 L577 304"/>
    <path d="M448 274 L448 324 M497 299 L546 269 M497 299 L546 331" opacity=".72"/>
  </g>
  <g fill="#ffffff" stroke="#176b80" stroke-width="4">
    <circle cx="399" cy="295" r="10"/><circle cx="448" cy="274" r="10"/><circle cx="448" cy="324" r="10"/>
    <circle cx="497" cy="299" r="10"/><circle cx="546" cy="269" r="10"/><circle cx="546" cy="331" r="10"/><circle cx="577" cy="304" r="10"/>
  </g>
  <g>
    <rect x="374" y="365" width="68" height="34" rx="9" fill="#edf3f4"/>
    <rect x="449" y="365" width="70" height="34" rx="9" fill="#edf3f4"/>
    <rect x="526" y="365" width="70" height="34" rx="9" fill="#edf3f4"/>
    <text class="sans chip" x="408" y="388" text-anchor="middle">focus</text>
    <text class="sans chip" x="484" y="388" text-anchor="middle">limit</text>
    <text class="sans chip" x="561" y="388" text-anchor="middle">drop</text>
  </g>

  <path d="M620 267 H694" fill="none" stroke="#176b80" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="sans flow-label" x="657" y="245" text-anchor="middle">RAW ACTION</text>

  <g filter="url(#shadow)">
    <rect x="700" y="115" width="270" height="305" rx="18" fill="#ffffff" stroke="#efaa94" stroke-width="2"/>
    <rect x="700" y="115" width="270" height="8" rx="4" fill="#d96546"/>
  </g>
  <rect x="724" y="145" width="124" height="34" rx="17" fill="#faeae5"/>
  <text class="sans label" x="786" y="168" text-anchor="middle" fill="#b84b2e">SYMBOLIC</text>
  <text class="sans title" x="724" y="213">Safety shield</text>
  <text class="sans copy" x="724" y="243">Repairs unsafe proposals</text>
  <path d="M835 271 L881 288 V329 C881 362 858 382 835 392 C812 382 789 362 789 329 V288 Z" fill="#faeae5" stroke="#d96546" stroke-width="4"/>
  <path d="M813 329 L829 346 L859 312" fill="none" stroke="#d96546" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="724" y="365" width="62" height="34" rx="9" fill="#f8eeea"/>
    <rect x="793" y="365" width="72" height="34" rx="9" fill="#f8eeea"/>
    <rect x="872" y="365" width="74" height="34" rx="9" fill="#f8eeea"/>
    <text class="sans chip" x="755" y="388" text-anchor="middle">guard</text>
    <text class="sans chip" x="829" y="388" text-anchor="middle">repair</text>
    <text class="sans chip" x="909" y="388" text-anchor="middle">verify</text>
  </g>

  <path d="M970 267 H1044" fill="none" stroke="#176b80" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="sans flow-label" x="1007" y="245" text-anchor="middle">SAFE ACTION</text>

  <g filter="url(#shadow)">
    <rect x="1050" y="145" width="300" height="245" rx="18" fill="#ffffff" stroke="#cad7db" stroke-width="2"/>
    <rect x="1050" y="145" width="300" height="8" rx="4" fill="#70c3d4"/>
  </g>
  <rect x="1074" y="175" width="126" height="34" rx="17" fill="#e6f2f4"/>
  <text class="sans label" x="1137" y="198" text-anchor="middle" fill="#176b80">EXECUTION</text>
  <text class="sans title" x="1074" y="243">DDoS mitigation</text>
  <text class="sans copy" x="1074" y="273">Protected service remains</text>
  <text class="sans copy" x="1074" y="298">available under attack</text>
  <g fill="none" stroke="#176b80" stroke-width="4" stroke-linecap="round">
    <rect x="1080" y="326" width="54" height="38" rx="7"/>
    <rect x="1152" y="314" width="54" height="50" rx="7"/>
    <rect x="1224" y="300" width="54" height="64" rx="7"/>
    <path d="M1093 347 H1121 M1165 335 H1193 M1237 322 H1265 M1237 338 H1265"/>
  </g>

  <path d="M184 390 V442 H366 V468" fill="none" stroke="#d96546" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow-coral)"/>
  <text class="sans label" x="278" y="430" text-anchor="middle" fill="#b84b2e">ADVERSARIAL CURRICULUM</text>
  <g filter="url(#shadow)">
    <rect x="150" y="475" width="500" height="110" rx="17" fill="#fff7f3" stroke="#efc1b2" stroke-width="2"/>
  </g>
  <circle cx="197" cy="530" r="24" fill="#fae2da"/>
  <path d="M186 530 H208 M197 519 V541" stroke="#d96546" stroke-width="4" stroke-linecap="round"/>
  <text class="sans label" x="237" y="516" fill="#b84b2e">CO-EVOLUTIONARY TRAINING</text>
  <text class="sans module-title" x="237" y="550">Adaptive attacker × Hall-of-Fame archive</text>
  <text class="sans module-copy" x="237" y="575">Historical attacks reduce forgetting and improve robustness.</text>

  <path d="M835 420 V468" fill="none" stroke="#176b80" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="750" y="475" width="500" height="110" rx="17" fill="#f0f8f9" stroke="#afd6de" stroke-width="2"/>
  </g>
  <circle cx="797" cy="530" r="24" fill="#dceff2"/>
  <path d="M786 516 V544 M786 522 H805 M786 530 H799 M786 538 H809" fill="none" stroke="#176b80" stroke-width="4" stroke-linecap="round"/>
  <text class="sans label" x="837" y="516" fill="#176b80">RULE CRYSTALLIZATION</text>
  <text class="sans module-title" x="837" y="550">Safe trajectories → decision-tree rules</text>
  <text class="sans module-copy" x="837" y="575">Human-readable policy logic supports trust and fallback.</text>
</svg>
