<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Two-stage LLM-enhanced DDoS detection framework</title>
  <desc id="desc">A paper-style framework diagram for next-generation IoT and edge networks, with traffic collection, machine-learning detection, LLM reasoning, and mitigation response.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.42" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="stageOne" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="stageTwo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="action" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#334155"/>
    </marker>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#cbd5e1" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#grid)" opacity="0.58"/>

  <g transform="translate(58 48)" font-family="Inter, Arial, sans-serif">
    <text x="0" y="0" font-size="28" font-weight="800" fill="#0f172a">
      Two-Stage LLM-Enhanced DDoS Detection Framework
    </text>
    <text x="0" y="36" font-size="16" font-weight="600" fill="#475569">
      Fast edge classification plus LLM-guided explanation and response for IoT traffic.
    </text>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="58" y="154" width="184" height="452" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="150" y="196" text-anchor="middle" font-size="18" font-weight="900" fill="#0f172a">IoT / Edge</text>
    <g transform="translate(94 228)">
      <rect x="0" y="0" width="42" height="62" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <rect x="66" y="18" width="42" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <rect x="22" y="92" width="86" height="48" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
      <circle cx="21" cy="184" r="21" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="86" cy="184" r="21" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
      <path d="M 21 205 L 21 250 M 86 205 L 86 250 M 21 228 L 86 228" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
      <text x="54" y="294" text-anchor="middle" font-size="14" font-weight="800" fill="#475569">sensors</text>
    </g>
    <rect x="88" y="548" width="124" height="34" rx="10" fill="#f1f5f9"/>
    <text x="150" y="570" text-anchor="middle" font-size="13" font-weight="800" fill="#475569">flow records</text>
  </g>

  <line x1="250" y1="382" x2="330" y2="382" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="338" y="154" width="250" height="452" rx="20" fill="url(#stageOne)" stroke="#60a5fa" stroke-width="2"/>
    <text x="463" y="196" text-anchor="middle" font-size="18" font-weight="900" fill="#0f172a">Stage 1</text>
    <text x="463" y="224" text-anchor="middle" font-size="16" font-weight="800" fill="#1e3a8a">Edge ML Detector</text>
    <rect x="380" y="266" width="166" height="58" rx="14" fill="#ffffff"/>
    <text x="463" y="300" text-anchor="middle" font-size="14" font-weight="800" fill="#1e40af">feature selection</text>
    <rect x="380" y="348" width="166" height="58" rx="14" fill="#ffffff"/>
    <text x="463" y="382" text-anchor="middle" font-size="14" font-weight="800" fill="#1e40af">shallow classifier</text>
    <rect x="380" y="430" width="166" height="58" rx="14" fill="#ffffff"/>
    <text x="463" y="464" text-anchor="middle" font-size="14" font-weight="800" fill="#1e40af">attack confidence</text>
    <path d="M 463 324 L 463 344 M 463 406 L 463 426" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>
    <rect x="376" y="535" width="174" height="36" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="463" y="558" text-anchor="middle" font-size="13" font-weight="900" fill="#1e3a8a">fast detection path</text>
  </g>

  <line x1="596" y1="382" x2="676" y2="382" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="684" y="154" width="250" height="452" rx="20" fill="url(#stageTwo)" stroke="#fb923c" stroke-width="2"/>
    <text x="809" y="196" text-anchor="middle" font-size="18" font-weight="900" fill="#0f172a">Stage 2</text>
    <text x="809" y="224" text-anchor="middle" font-size="16" font-weight="800" fill="#7c2d12">LLM Reasoning Layer</text>
    <rect x="726" y="268" width="166" height="58" rx="14" fill="#ffffff"/>
    <text x="809" y="302" text-anchor="middle" font-size="14" font-weight="800" fill="#9a3412">flow-to-prompt</text>
    <rect x="726" y="350" width="166" height="58" rx="14" fill="#ffffff"/>
    <text x="809" y="384" text-anchor="middle" font-size="14" font-weight="800" fill="#9a3412">context analysis</text>
    <rect x="726" y="432" width="166" height="58" rx="14" fill="#ffffff"/>
    <text x="809" y="456" text-anchor="middle" font-size="13" font-weight="800" fill="#9a3412">explainable</text>
    <text x="809" y="474" text-anchor="middle" font-size="13" font-weight="800" fill="#9a3412">decision</text>
    <path d="M 809 326 L 809 344 M 809 408 L 809 426" stroke="#9a3412" stroke-width="4" stroke-linecap="round"/>
    <rect x="722" y="535" width="174" height="36" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="809" y="558" text-anchor="middle" font-size="13" font-weight="900" fill="#7c2d12">human-readable logic</text>
  </g>

  <line x1="942" y1="382" x2="1022" y2="382" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="1030" y="154" width="112" height="452" rx="20" fill="url(#action)" stroke="#22c55e" stroke-width="2"/>
    <text x="1086" y="194" text-anchor="middle" font-size="16" font-weight="900" fill="#0f172a">Action</text>
    <g transform="translate(1054 240)">
      <path d="M 32 0 L 58 14 L 58 46 C 58 82 44 106 32 116 C 20 106 6 82 6 46 L 6 14 Z" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
      <path d="M 20 56 L 30 68 L 46 42" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="1086" y="404" text-anchor="middle" font-size="13" font-weight="800" fill="#166534">mitigate</text>
    <text x="1086" y="428" text-anchor="middle" font-size="13" font-weight="800" fill="#166534">throttle</text>
    <text x="1086" y="452" text-anchor="middle" font-size="13" font-weight="800" fill="#166534">alert</text>
    <rect x="1052" y="535" width="68" height="36" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="1086" y="558" text-anchor="middle" font-size="12" font-weight="900" fill="#166534">policy</text>
  </g>

  <path d="M 809 626 C 720 690, 462 690, 462 626" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 9"/>
  <text x="638" y="704" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#475569">
    feedback loop: updated thresholds, analyst notes, and edge policy refinement
  </text>
</svg>
